# ChallengeHouse (custom_components/fitbridge/opengym_app.py) relies on the slug, the options and ingress port 8099.
name: openGym
version: "1.0.1"
slug: opengym
description: Self-hosted gym log, in your Home Assistant sidebar
arch: [amd64, aarch64]
init: false
homeassistant_api: true
ingress: true
panel_icon: mdi:dumbbell
panel_title: openGym
panel_admin: false
options:
  address: ""
  invite_only: false
  first_user_admin: true
schema:
  address: "str?"
  invite_only: bool
  first_user_admin: bool

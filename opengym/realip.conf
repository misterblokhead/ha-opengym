# Ingress requests come from HA's internal network; trust it so $remote_addr is the visitor.
# The whole /23, not only the Supervisor (.2, the peer): Core (.1) adds itself to X-Forwarded-For, so trusting .2 alone makes every visitor .1.
set_real_ip_from 172.30.32.0/23;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
